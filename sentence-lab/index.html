<title>Sentence Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a single working "desk" — sources on top, a ruled writing line, a tray of colour-coded blocks below. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #18202e;
  --muted: #5b6577;
  --line: #d5dbe5;
  --accent: #1f5fd1;
  --accent-ink: #ffffff;
  --good: #1b7f4b;
  --good-bg: #e6f4ec;
  --bad: #c03a2b;
  --bad-bg: #fbeceb;
  --warn-bg: #fff5e0;

  /* role colours: border / fill */
  --r-main: #2f62c9;   --r-main-bg: #e7eefc;
  --r-sub: #138471;    --r-sub-bg: #e1f4ef;
  --r-link: #b5650d;   --r-link-bg: #fdf0dc;
  --r-phrase: #7a5bc4; --r-phrase-bg: #efe9fb;
  --r-rel: #138471;    --r-rel-bg: #e1f4ef;
  --r-part: #c2416b;   --r-part-bg: #fbe8ef;
  --r-noun: #7a5bc4;   --r-noun-bg: #efe9fb;
  --r-punct: #5b6577;  --r-punct-bg: #eef1f5;

  --f-display: "Bricolage Grotesque", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --surface: #19202a; --ink: #e6eaf1; --muted: #9aa5b6; --line: #2c3544;
    --accent: #6b9bff; --accent-ink: #0d1422;
    --good: #5fcf92; --good-bg: #13291e; --bad: #ff8577; --bad-bg: #321a18; --warn-bg: #2e2513;
    --r-main: #7ea4f5; --r-main-bg: #1a2741;
    --r-sub: #4fc9b2; --r-sub-bg: #12302b;
    --r-link: #f0a64d; --r-link-bg: #33250f;
    --r-phrase: #b39cf0; --r-phrase-bg: #261f3d;
    --r-rel: #4fc9b2; --r-rel-bg: #12302b;
    --r-part: #f27fa4; --r-part-bg: #3a1a26;
    --r-noun: #b39cf0; --r-noun-bg: #261f3d;
    --r-punct: #9aa5b6; --r-punct-bg: #232b37;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #19202a; --ink: #e6eaf1; --muted: #9aa5b6; --line: #2c3544;
  --accent: #6b9bff; --accent-ink: #0d1422;
  --good: #5fcf92; --good-bg: #13291e; --bad: #ff8577; --bad-bg: #321a18; --warn-bg: #2e2513;
  --r-main: #7ea4f5; --r-main-bg: #1a2741;
  --r-sub: #4fc9b2; --r-sub-bg: #12302b;
  --r-link: #f0a64d; --r-link-bg: #33250f;
  --r-phrase: #b39cf0; --r-phrase-bg: #261f3d;
  --r-rel: #4fc9b2; --r-rel-bg: #12302b;
  --r-part: #f27fa4; --r-part-bg: #3a1a26;
  --r-noun: #b39cf0; --r-noun-bg: #261f3d;
  --r-punct: #9aa5b6; --r-punct-bg: #232b37;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.6;
}
.wrap {
  max-width: 880px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  display: flex; flex-direction: column; gap: 20px;
}
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.8rem, 4vw, 2.4rem); line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
.tagline { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
.level { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }

.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab {
  font: inherit; font-weight: 600; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 10px 16px; border-radius: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 0; text-align: left; flex: 1 1 240px;
}
.tab small { font-weight: 400; color: var(--muted); font-size: .85rem; }
.tab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tab:focus-visible, button:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.strip { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.strip .label { font-size: .85rem; color: var(--muted); margin-right: 4px; }
.dot {
  width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font-family: var(--f-mono); font-size: .85rem; cursor: pointer; display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.dot.done { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.dot.revealed { background: var(--warn-bg); border-color: var(--r-link); color: var(--r-link); }
.dot.current { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.progress { margin-left: auto; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.desk { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(16px, 3vw, 28px); display: flex; flex-direction: column; gap: 22px; }
.topic { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.topic h2 { margin: 0; font-family: var(--f-display); font-size: 1.35rem; font-weight: 700; text-wrap: balance; }
.topic .task { color: var(--muted); font-size: .95rem; }

.sources { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.sources li { font-family: var(--f-display); font-weight: 500; font-size: 1.15rem; display: flex; gap: 10px; align-items: baseline; }
.sources li::before { content: attr(data-n); font-family: var(--f-mono); font-size: .75rem; color: var(--muted); min-width: 1.2em; }
.target { font-size: .92rem; background: var(--bg); border-radius: 8px; padding: 8px 12px; color: var(--ink); }
.target b { font-weight: 600; }

.sec-label { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }

.answer {
  min-height: 64px; padding: 10px 4px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  border-bottom: 2px dashed var(--line);
}
.answer.empty::before { content: "แตะบล็อกด้านล่างเพื่อเรียงประโยคตรงนี้"; color: var(--muted); font-size: .92rem; padding-left: 4px; }
.answer.correct { border-bottom: 2px solid var(--good); }
.answer.wrong { border-bottom: 2px solid var(--bad); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; }
.bank.empty::before { content: "ใช้บล็อกครบแล้ว"; color: var(--muted); font-size: .9rem; }

.chip {
  font-family: var(--f-display); font-weight: 500; font-size: 1.05rem; line-height: 1.3;
  border: 1.5px solid var(--r-c, var(--line)); background: var(--r-bg, var(--bg)); color: var(--ink);
  padding: 7px 12px; border-radius: 8px; cursor: pointer; text-align: left;
  transition: transform .12s ease, box-shadow .12s ease;
}
.chip:hover { transform: translateY(-1px); box-shadow: 0 2px 0 var(--r-c, var(--line)); }
.chip.punct { min-width: 38px; text-align: center; font-weight: 700; }
.chip.off { --r-c: var(--line); --r-bg: var(--bg); }
.chip.bad-tile { outline: 2px solid var(--bad); outline-offset: 2px; }
.chip[disabled] { cursor: default; transform: none; box-shadow: none; }

.r-main  { --r-c: var(--r-main);  --r-bg: var(--r-main-bg); }
.r-sub   { --r-c: var(--r-sub);   --r-bg: var(--r-sub-bg); }
.r-link  { --r-c: var(--r-link);  --r-bg: var(--r-link-bg); }
.r-phrase{ --r-c: var(--r-phrase);--r-bg: var(--r-phrase-bg); }
.r-rel   { --r-c: var(--r-rel);   --r-bg: var(--r-rel-bg); }
.r-part  { --r-c: var(--r-part);  --r-bg: var(--r-part-bg); }
.r-noun  { --r-c: var(--r-noun);  --r-bg: var(--r-noun-bg); }
.r-punct { --r-c: var(--r-punct); --r-bg: var(--r-punct-bg); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--r-c); background: var(--r-bg); display: inline-block; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: inherit; font-weight: 500; font-size: .95rem; cursor: pointer; padding: 9px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .45; cursor: default; }
.spacer { flex: 1; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--muted); cursor: pointer; text-transform: none; letter-spacing: 0; font-family: var(--f-body); }

.feedback { border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: .97rem; }
.feedback.good { background: var(--good-bg); }
.feedback.bad { background: var(--bad-bg); }
.feedback.info { background: var(--warn-bg); }
.feedback h3 { margin: 0; font-size: 1.02rem; font-weight: 600; }
.feedback.good h3 { color: var(--good); }
.feedback.bad h3 { color: var(--bad); }
.feedback p { margin: 0; max-width: 68ch; }
.feedback ul { margin: 0; padding-left: 1.2em; }
.final { font-family: var(--f-display); font-size: 1.2rem; font-weight: 500; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.breakdown { display: flex; flex-wrap: wrap; gap: 6px; }
.part { display: flex; flex-direction: column; gap: 2px; border: 1.5px solid var(--r-c); background: var(--r-bg); border-radius: 8px; padding: 5px 9px; }
.part b { font-family: var(--f-display); font-weight: 500; font-size: .98rem; }
.part small { font-family: var(--f-mono); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; color: var(--r-c); }
.alt { font-family: var(--f-display); }
.speak { font: inherit; font-size: .85rem; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 3px 10px; }

details.ref { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 18px; }
details.ref summary { cursor: pointer; font-weight: 600; padding: 12px 0; }
.table-wrap { overflow-x: auto; padding-bottom: 14px; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; min-width: 520px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
td.en { font-family: var(--f-display); font-weight: 500; white-space: nowrap; }
td.ex { font-family: var(--f-display); }

@media (prefers-reduced-motion: reduce) { .chip { transition: none; } .chip:hover { transform: none; } }
@media (max-width: 520px) {
  .chip { font-size: 1rem; padding: 7px 10px; }
  .sources li { font-size: 1.05rem; }
  .progress { margin-left: 0; width: 100%; }
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Sentence Lab</h1>
      <p class="tagline">ฝึกต่อประโยคภาษาอังกฤษให้ยาวขึ้นและเป็นธรรมชาติขึ้น ด้วยการเรียงบล็อก</p>
    </div>
    <span class="level">Level B2–C1</span>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-combine" data-mod="combine">หมวด 1 · รวมประโยค<small>Sentence Combining · คำเชื่อมระดับสูง</small></button>
    <button class="tab" role="tab" id="tab-clause" data-mod="clause">หมวด 2 · อนุประโยคซ้อน<small>Complex Clauses · relative, noun, participle</small></button>
  </div>

  <div class="strip" id="strip"></div>

  <section class="desk" aria-live="polite">
    <div class="topic"><h2 id="topic"></h2><span class="task" id="task"></span></div>
    <ol class="sources" id="sources"></ol>
    <div class="target" id="target"></div>

    <div>
      <p class="sec-label"><span>ประโยคของคุณ</span><span id="speakWrap"></span></p>
      <div class="answer empty" id="answer"></div>
    </div>

    <div>
      <p class="sec-label"><span>บล็อกที่ใช้ได้ (มีตัวหลอกปนอยู่)</span>
        <label class="toggle"><input type="checkbox" id="colorToggle" checked> สีบอกหน้าที่</label>
      </p>
      <div class="bank" id="bank"></div>
    </div>

    <div class="legend" id="legend"></div>

    <div class="controls">
      <button class="btn" id="btnClear">ล้าง</button>
      <button class="btn" id="btnHint">คำใบ้</button>
      <button class="btn" id="btnReveal">ดูเฉลย</button>
      <span class="spacer"></span>
      <button class="btn primary" id="btnCheck">ตรวจคำตอบ</button>
      <button class="btn primary" id="btnNext" hidden>ข้อต่อไป →</button>
    </div>

    <div id="feedback" hidden></div>
  </section>

  <details class="ref" id="ref"></details>
</div>

<script>
const ROLE = {
  main:   "ประโยคหลัก",
  sub:    "อนุประโยค",
  link:   "คำเชื่อม",
  phrase: "นามวลี",
  rel:    "Relative clause",
  part:   "Participle clause",
  noun:   "Noun clause",
  punct:  "เครื่องหมาย"
};
const LEGEND = {
  combine: ["main", "link", "sub", "phrase", "punct"],
  clause:  ["main", "rel", "noun", "part", "link", "punct"]
};

const DATA = {
  combine: [
    { id: "c1", topic: "Although", task: "รวมเป็นประโยคเดียว",
      src: ["The meeting was long.", "Nobody wanted to leave."],
      target: "ใช้คำเชื่อมแสดง <b>ความขัดแย้ง</b> (ถึงแม้ว่า…ก็ยัง…)",
      tiles: [["although","link"],["the meeting was long","sub"],[",","punct"],["nobody wanted to leave","main"],["because","link"],["despite","link"]],
      answers: ["although the meeting was long, nobody wanted to leave", "nobody wanted to leave although the meeting was long"],
      mistakes: [
        { has: "because", msg: "because แปลว่า 'เพราะ' แต่การประชุมที่ยาวไม่ใช่เหตุผลที่ทำให้ไม่มีใครอยากกลับ ความหมายจึงขัดกัน ต้องใช้คำที่แสดงความขัดแย้ง" },
        { has: "despite", msg: "despite ต้องตามด้วยคำนามหรือ V-ing เช่น despite the long meeting จะตามด้วยประโยคเต็ม (ประธาน + กริยา) ไม่ได้" }
      ],
      explain: "Although + ประโยค แปลว่า 'ถึงแม้ว่า' ถ้าขึ้นต้นประโยคด้วย although ต้องใส่จุลภาค (,) ก่อนประโยคหลัก แต่ถ้าวางไว้กลางประโยคไม่ต้องใส่",
      th: "ถึงแม้การประชุมจะยาว แต่ก็ไม่มีใครอยากกลับ" },

    { id: "c2", topic: "Despite vs Although", task: "รวมเป็นประโยคเดียว (ทำได้ 2 ทาง)",
      src: ["It rained heavily.", "The match went ahead."],
      target: "ลองใช้ <b>despite</b> กับนามวลี หรือ <b>although</b> กับประโยคเต็ม",
      tiles: [["despite","link"],["the heavy rain","phrase"],[",","punct"],["the match went ahead","main"],["although","link"],["it rained heavily","sub"]],
      answers: ["despite the heavy rain, the match went ahead", "the match went ahead despite the heavy rain", "although it rained heavily, the match went ahead", "the match went ahead although it rained heavily"],
      mistakes: [
        { has: "despite it rained", msg: "despite ตามด้วยประโยคเต็มไม่ได้ ถ้าจะใช้ despite ให้ตามด้วยนามวลี the heavy rain" },
        { has: "although the heavy rain", msg: "although ต้องตามด้วยประโยคที่มีประธานและกริยา (it rained heavily) ส่วน the heavy rain เป็นแค่นามวลี" }
      ],
      explain: "despite / in spite of + คำนาม หรือ V-ing ส่วน although / even though + ประโยค ความหมายเหมือนกัน ต่างกันที่โครงสร้างที่ตามมา",
      th: "แม้ฝนจะตกหนัก แต่การแข่งขันก็ยังดำเนินต่อไป" },

    { id: "c3", topic: "Not only … but also", task: "รวมเป็นประโยคเดียว",
      src: ["He speaks Japanese.", "He also speaks Korean."],
      target: "เน้นว่าทำได้ <b>ทั้งสองอย่าง</b> แบบน่าประทับใจ",
      tiles: [["he speaks","main"],["not only","link"],["Japanese","phrase"],["but also","link"],["Korean","phrase"],["and also","link"]],
      answers: ["he speaks not only Japanese but also Korean"],
      mistakes: [{ has: "and also", msg: "not only ต้องจับคู่กับ but also เสมอ ใช้ and also แทนไม่ได้" }],
      explain: "not only A but also B ใช้เน้นว่า 'ไม่เพียงแต่ A แต่ยัง B ด้วย' โดย A และ B ควรเป็นชนิดคำเดียวกัน (ในข้อนี้เป็นชื่อภาษาทั้งคู่)",
      th: "เขาพูดได้ไม่เพียงแค่ภาษาญี่ปุ่น แต่ยังพูดภาษาเกาหลีได้ด้วย" },

    { id: "c4", topic: "Provided that", task: "รวมเป็นประโยคเดียว",
      src: ["You can borrow my car.", "You must return it by Friday."],
      target: "บอก <b>เงื่อนไข</b> (ได้ ก็ต่อเมื่อ…)",
      tiles: [["you can borrow my car","main"],["provided that","link"],["you return it by Friday","sub"],["unless","link"],[",","punct"]],
      answers: ["you can borrow my car provided that you return it by Friday", "provided that you return it by Friday, you can borrow my car"],
      mistakes: [{ has: "unless", msg: "unless แปลว่า 'ถ้าไม่' ความหมายจะกลายเป็น 'ยืมรถได้ถ้าคุณไม่คืนภายในวันศุกร์' ซึ่งตรงข้ามกับที่ต้องการ" }],
      explain: "provided that (หรือ providing / as long as) แปลว่า 'โดยมีเงื่อนไขว่า' สังเกตว่าหลังคำนี้ใช้ปัจจุบันกาลธรรมดา (you return) ไม่ต้องใส่ must หรือ will",
      th: "คุณยืมรถฉันได้ โดยมีเงื่อนไขว่าต้องคืนภายในวันศุกร์" },

    { id: "c5", topic: "Whereas", task: "รวมเป็นประโยคเดียว",

    head: ["ชนิด", "หน้าที่", "รูป", "ตัวอย่าง"],
    rows: [
      ["Defining relative", "ระบุว่าหมายถึงคนไหน/อันไหน", "who / which / that", "The man who called you is here."],
      ["Non-defining relative", "ข้อมูลเสริม คั่นด้วยจุลภาค", "who / which (ห้าม that)", "Bangkok, which is huge, never sleeps."],
      ["whose / in which / where", "ความเป็นเจ้าของ / สถานที่", "whose + นาม, prep + which", "The town where I was born is tiny."],
      ["Noun clause", "ทั้งก้อนทำหน้าที่เป็นคำนาม", "what / whether / that + ประโยค", "What matters is the result."],
      ["Present participle", "ย่อประโยคเชิงกระทำ", "V-ing / Not V-ing", "Feeling tired, I went to bed."],
      ["Perfect participle", "เหตุการณ์ที่เสร็จก่อน", "Having + V3", "Having eaten, we left."],
      ["Reduced relative (passive)", "ย่อ which was + V3", "นาม + V3", "The car parked outside is mine."]
    ] }
};

/* ---------- state ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let progress = store.get("sl-progress", {});      // id -> "done" | "revealed"
let mod = store.get("sl-mod", "combine");
if (!DATA[mod]) mod = "combine";
let idx = 0;
let placed = [];        // tile indices in answer order
let checked = null;     // null | "correct" | "wrong"
let badFrom = -1;
let showColors = store.get("sl-colors", true);

const $ = id => document.getElementById(id);
const ex = () => DATA[mod][idx];
const norm = s => s.toLowerCase().replace(/\s+,/g, ",").replace(/\s+/g, " ").trim();
const textOf = arr => arr.map(i => ex().tiles[i][0]).join(" ");
const display = s => { s = s.replace(/\s+,/g, ","); return s.charAt(0).toUpperCase() + s.slice(1) + "."; };

function isPrefix(answer, built) {
  const a = norm(answer), b = norm(built);
  if (!b) return true;
  if (!a.startsWith(b)) return false;
  const next = a.charAt(b.length);
  return next === "" || next === " " || next === ",";
}
function matchLen(answer) {
  let k = 0;
  for (let n = 1; n <= placed.length; n++) {
    if (isPrefix(answer, textOf(placed.slice(0, n)))) k = n; else break;
  }
  return k;
}
function bestAnswer() {
  let best = ex().answers[0], bk = -1;
  for (const a of ex().answers) { const k = matchLen(a); if (k > bk) { bk = k; best = a; } }
  return { answer: best, k: bk };
}
function tilesFor(answer) {
  const out = [];
  const used = new Set();
  while (norm(textOf(out)) !== norm(answer)) {
    const i = ex().tiles.findIndex((t, j) => !used.has(j) && isPrefix(answer, textOf(out.concat(j))));
    if (i < 0) break;
    out.push(i); used.add(i);
  }
  return out;
}

/* ---------- rendering ---------- */
function chip(i, where) {
  const [text, role] = ex().tiles[i];
  const b = document.createElement("button");
  b.className = "chip r-" + role + (role === "punct" ? " punct" : "") + (showColors ? "" : " off");
  b.textContent = text;
  b.setAttribute("aria-label", (where === "bank" ? "เพิ่ม: " : "เอาออก: ") + text);
  if (checked === "correct") b.disabled = true;
  return b;
}

function render() {
  const e = ex();
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.mod === mod));

  // strip
  const strip = $("strip"); strip.innerHTML = "";
  const lab = document.createElement("span"); lab.className = "label"; lab.textContent = "ข้อ"; strip.append(lab);
  DATA[mod].forEach((x, i) => {
    const d = document.createElement("button");
    d.className = "dot" + (progress[x.id] ? " " + progress[x.id] : "") + (i === idx ? " current" : "");
    d.textContent = i + 1;
    d.setAttribute("aria-label", `ข้อ ${i + 1}: ${x.topic}`);
    d.onclick = () => go(i);
    strip.append(d);
  });
  const done = DATA[mod].filter(x => progress[x.id] === "done").length;
  const p = document.createElement("span"); p.className = "progress";
  p.textContent = `ทำถูกเอง ${done}/${DATA[mod].length} ข้อ`;
  strip.append(p);

  $("topic").textContent = e.topic;
  $("task").textContent = e.task;
  $("sources").innerHTML = "";
  e.src.forEach((s, i) => { const li = document.createElement("li"); li.dataset.n = i + 1; li.textContent = s; $("sources").append(li); });
  $("target").innerHTML = "🎯 " + e.target;

  // answer line
  const ans = $("answer"); ans.innerHTML = "";
  ans.className = "answer" + (placed.length ? "" : " empty") + (checked === "correct" ? " correct" : checked === "wrong" && badFrom >= 0 ? " wrong" : "");
  placed.forEach((ti, pos) => {
    const b = chip(ti, "answer");
    if (checked === "wrong" && badFrom >= 0 && pos >= badFrom) b.classList.add("bad-tile");
    b.onclick = () => { placed.splice(pos, 1); clearCheck(); render(); };
    ans.append(b);
  });

  // bank
  const bank = $("bank"); bank.innerHTML = "";
  const free = e.tiles.map((_, i) => i).filter(i => !placed.includes(i));
  bank.className = "bank" + (free.length ? "" : " empty");
  free.forEach(i => {
    const b = chip(i, "bank");
    b.onclick = () => { placed.push(i); clearCheck(); render(); };
    bank.append(b);
  });

  // legend
  const lg = $("legend"); lg.innerHTML = "";
  lg.hidden = !showColors;
  LEGEND[mod].forEach(r => { const s = document.createElement("span"); s.innerHTML = `<i class="r-${r}"></i>${ROLE[r]}`; lg.append(s); });

  // speak current sentence
  const sw = $("speakWrap"); sw.innerHTML = "";
  if ("speechSynthesis" in window && placed.length) {
    const s = document.createElement("button"); s.className = "speak"; s.textContent = "🔊 ฟังประโยคนี้";
    s.onclick = () => speak(display(textOf(placed)));
    sw.append(s);
  }

  const solved = checked === "correct";
  $("btnCheck").hidden = solved;
  $("btnNext").hidden = !solved;
  $("btnHint").disabled = solved;
  $("btnReveal").disabled = solved;
  $("btnClear").disabled = solved || !placed.length;
  $("btnNext").textContent = idx < DATA[mod].length - 1 ? "ข้อต่อไป →" : (mod === "combine" ? "ไปหมวด 2 →" : "กลับไปข้อ 1");

  renderRef();
}

function renderRef() {
  const r = REF[mod];
  const open = $("ref").open;
  $("ref").innerHTML = `<summary>📘 ${r.title}</summary><div class="table-wrap"><table><thead><tr>${r.head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${
    r.rows.map(row => `<tr><td class="en">${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td class="ex">${row[3]}</td></tr>`).join("")
  }</tbody></table></div>`;
  $("ref").open = open;
}

function feedback(kind, html) {
  const f = $("feedback");
  f.className = "feedback " + kind;
  f.innerHTML = html;
  f.hidden = false;
}
function clearCheck() { checked = null; badFrom = -1; $("feedback").hidden = true; }

function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch {}
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function showSolved(viaReveal) {
  const e = ex();
  checked = "correct";
  if (viaReveal) { if (progress[e.id] !== "done") progress[e.id] = "revealed"; }
  else progress[e.id] = "done";
  store.set("sl-progress", progress);

  const built = textOf(placed);
  const parts = placed.filter(i => e.tiles[i][1] !== "punct").map(i => {
    const [t, r] = e.tiles[i];
    return `<span class="part r-${r}"><small>${ROLE[r]}</small><b>${esc(t)}</b></span>`;
  }).join("");
  const others = e.answers.filter(a => norm(a) !== norm(built));
  const speakBtn = "speechSynthesis" in window ? `<button class="speak" data-say="${esc(display(built))}">🔊 ฟัง</button>` : "";
  feedback("good", `
    <h3>${viaReveal ? "เฉลย" : "ถูกต้อง! 🎉"}</h3>
    <div class="final">${esc(display(built))} ${speakBtn}</div>
    <p>แปล: ${esc(e.th)}</p>
    <div class="breakdown">${parts}</div>
    <p>${esc(e.explain)}</p>
    ${others.length ? `<p>แบบอื่นที่ถูกเหมือนกัน:</p><ul>${others.map(a => `<li class="alt">${esc(display(a))}</li>`).join("")}</ul>` : ""}
  `);
  render();
}

/* ---------- actions ---------- */
function check() {
  const e = ex();
  if (!placed.length) { feedback("info", "<p>ยังไม่ได้วางบล็อกเลย แตะบล็อกด้านล่างเพื่อเริ่มเรียงประโยค</p>"); return; }
  const built = norm(textOf(placed));
  if (e.answers.some(a => norm(a) === built)) { showSolved(false); return; }

  checked = "wrong";
  const { k } = bestAnswer();
  badFrom = k;
  const hits = e.mistakes.filter(m => built.includes(norm(m.has))).map(m => m.msg);
  let html = "";
  if (hits.length) {
    html = `<h3>ยังไม่ถูก</h3><ul>${hits.map(h => `<li>${esc(h)}</li>`).join("")}</ul>`;
  } else if (k === placed.length) {
    html = `<h3>มาถูกทางแล้ว</h3><p>ส่วนที่วางไว้ถูกต้อง แต่ประโยคยังไม่ครบ ลองเติมบล็อกที่เหลือ (ระวังตัวหลอก)</p>`;
    badFrom = -1;
  } else {
    html = `<h3>ลำดับยังไม่ถูก</h3><p>${k > 0 ? `${k} บล็อกแรกถูกแล้ว ` : ""}บล็อกที่มีกรอบแดงวางผิดตำแหน่ง ลองดูว่าคำเชื่อมควรอยู่หน้าประโยคไหน และต้องใช้จุลภาคหรือไม่</p>`;
  }
  feedback(k === placed.length && !hits.length ? "info" : "bad", html);
  render();
}

function hint() {
  const { answer, k } = bestAnswer();
  placed = placed.slice(0, Math.max(k, 0));
  const next = ex().tiles.findIndex((t, j) => !placed.includes(j) && isPrefix(answer, textOf(placed.concat(j))));
  clearCheck();
  if (next >= 0) {
    placed.push(next);
    const done = norm(textOf(placed)) === norm(answer);
    if (done) { showSolved(true); return; }
    feedback("info", `<p>💡 ใส่บล็อกถัดไปให้แล้ว: <b>${esc(ex().tiles[next][0])}</b>${k < 0 ? "" : " (บล็อกที่ผิดถูกย้ายกลับไปแล้ว)"}</p>`);
  }
  render();
}

function reveal() {
  placed = tilesFor(bestAnswer().answer);
  showSolved(true);
}

function go(i) {
  idx = i; placed = []; clearCheck(); render();
  window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
function next() {
  if (idx < DATA[mod].length - 1) go(idx + 1);
  else if (mod === "combine") switchMod("clause");
  else go(0);
}
function switchMod(m) { mod = m; store.set("sl-mod", m); idx = 0; placed = []; clearCheck(); render(); }

document.querySelectorAll(".tab").forEach(t => t.onclick = () => switchMod(t.dataset.mod));
$("btnClear").onclick = () => { placed = []; clearCheck(); render(); };
$("btnHint").onclick = hint;
$("btnReveal").onclick = reveal;
$("btnCheck").onclick = check;
$("btnNext").onclick = next;
$("colorToggle").checked = showColors;
$("colorToggle").onchange = e => { showColors = e.target.checked; store.set("sl-colors", showColors); render(); };
$("feedback").addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) speak(b.dataset.say); });

render();
</script>
